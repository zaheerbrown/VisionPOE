
name: VISION Android CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Test VISION
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Step 1: Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install Java 17
      - name: Set Up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Step 3: Install Android SDK
      - name: Set Up Android SDK
        uses: android-actions/setup-android@v3

      # Step 4: Install required SDK packages
      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      # Step 5: Configure Gradle caching
      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Step 6: Make Gradle executable
      - name: Grant Gradle Permissions
        run: chmod +x ./gradlew

      # Step 7: Run unit tests
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Step 8: Build debug APK
      - name: Build VISION Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Step 9: Upload APK
      - name: Upload VISION APK
        uses: actions/upload-artifact@v4
        with:
          name: VISION-Part3-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # Step 10: Upload test reports
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VISION-Test-Reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14
